<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="webapp-fullscreen" content="{% if webapp_fullscreen_enabled %}1{% else %}0{% endif %}">
    <title>Анализ матча</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --border: #444;
            --text: #f2f2f2;
            --muted: #aaa;
            --accent: #6f42c1;
            --danger: #c0392b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }
        h1 { font-size: 1.35rem; margin: 0 0 16px; }
        .list { display: flex; flex-direction: column; gap: 10px; }
        .item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .item:hover { border-color: var(--accent); }
        .item-title {
            font-weight: bold;
            font-size: 1rem;
            flex: 1;
            min-width: 0;
            word-break: break-word;
        }
        .item-edit {
            flex-shrink: 0;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 18px;
            padding: 6px 8px;
            cursor: pointer;
            border-radius: 6px;
            line-height: 1;
        }
        .item-edit:hover { color: var(--accent); background: rgba(111, 66, 193, 0.15); }
        .item-delete:hover { color: var(--danger); background: rgba(192, 57, 43, 0.15); }
        .item-actions {
            display: flex;
            flex-shrink: 0;
            gap: 2px;
            align-items: center;
        }
        .empty { color: var(--muted); padding: 24px 0; text-align: center; }
        .error { color: #e74c3c; padding: 8px 0; font-size: 0.9rem; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            width: 100%;
            max-width: 400px;
        }
        .modal h2 {
            margin: 0 0 14px;
            font-size: 1.1rem;
        }
        .modal p {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .modal p strong { color: var(--text); }
        .modal input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #1a1a1a;
            color: var(--text);
            font-size: 16px;
            margin-bottom: 14px;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal-actions button {
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            background: #444;
            color: #fff;
        }
        .modal-actions button.primary { background: var(--accent); }
        .modal-actions button.danger { background: var(--danger); }
        .modal-actions button:disabled { opacity: 0.5; cursor: default; }
    </style>
</head>
<body>
    <h1>Анализ матча</h1>
    <div id="error" class="error" style="display:none;"></div>
    <div id="list" class="list"></div>

    <div id="renameModal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal">
            <h2>Название матча</h2>
            <input type="text" id="renameInput" maxlength="255" autocomplete="off">
            <div class="modal-actions">
                <button type="button" onclick="closeRenameModal()">Отмена</button>
                <button type="button" class="primary" id="renameSaveBtn" onclick="saveRename()">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal">
            <h2>Удалить матч?</h2>
            <p>Матч <strong id="deleteModalName"></strong> будет удалён без возможности восстановления.</p>
            <div class="modal-actions">
                <button type="button" onclick="closeDeleteModal()">Отмена</button>
                <button type="button" class="danger" id="deleteConfirmBtn" onclick="confirmDelete()">Удалить</button>
            </div>
        </div>
    </div>

    <script>
        let renameTargetId = null;
        let deleteTargetId = null;
        let itemsCache = [];

        function getInitData() {
            try {
                return (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || '';
            } catch (e) {
                return '';
            }
        }

        function showError(text) {
            const el = document.getElementById('error');
            if (!text) {
                el.style.display = 'none';
                el.textContent = '';
                return;
            }
            el.style.display = 'block';
            el.textContent = text;
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function cardTitle(it) {
            const players = [it.red_player, it.black_player].filter(Boolean).join(' vs ');
            const t = (it.title && String(it.title).trim()) || '';
            // Старые сохранения с именем .mat — показываем игроков; переименованные — title
            if (t && !/\.mat$/i.test(t)) return t;
            return players || t || ('Матч #' + it.id);
        }

        function openView(id) {
            window.location.href = '/match-analysis-view?id=' + encodeURIComponent(id) + '&error=0';
        }

        function openRenameModal(id, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            const it = itemsCache.find((x) => String(x.id) === String(id));
            if (!it) return;
            renameTargetId = it.id;
            const input = document.getElementById('renameInput');
            input.value = cardTitle(it);
            document.getElementById('renameModal').classList.add('open');
            setTimeout(() => {
                input.focus();
                input.select();
            }, 50);
        }

        function closeRenameModal() {
            renameTargetId = null;
            document.getElementById('renameModal').classList.remove('open');
        }

        function openDeleteModal(id, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            const it = itemsCache.find((x) => String(x.id) === String(id));
            if (!it) return;
            deleteTargetId = it.id;
            document.getElementById('deleteModalName').textContent = cardTitle(it);
            document.getElementById('deleteModal').classList.add('open');
        }

        function closeDeleteModal() {
            deleteTargetId = null;
            document.getElementById('deleteModal').classList.remove('open');
        }

        async function confirmDelete() {
            if (deleteTargetId == null) return;
            const btn = document.getElementById('deleteConfirmBtn');
            btn.disabled = true;
            showError('');
            try {
                const resp = await fetch('/api/match_analysis/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        init_data: getInitData(),
                        id: deleteTargetId,
                    }),
                });
                const payload = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(payload.detail || ('HTTP ' + resp.status));
                itemsCache = itemsCache.filter((x) => String(x.id) !== String(deleteTargetId));
                closeDeleteModal();
                renderItems(itemsCache);
            } catch (e) {
                showError('Ошибка удаления: ' + (e.message || e));
            } finally {
                btn.disabled = false;
            }
        }

        async function saveRename() {
            if (renameTargetId == null) return;
            const title = (document.getElementById('renameInput').value || '').trim();
            if (!title) {
                showError('Название не может быть пустым');
                return;
            }
            const btn = document.getElementById('renameSaveBtn');
            btn.disabled = true;
            showError('');
            try {
                const resp = await fetch('/api/match_analysis/update_meta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        init_data: getInitData(),
                        id: renameTargetId,
                        title: title,
                    }),
                });
                const payload = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(payload.detail || ('HTTP ' + resp.status));
                const it = itemsCache.find((x) => String(x.id) === String(renameTargetId));
                if (it) it.title = payload.title || title;
                closeRenameModal();
                renderItems(itemsCache);
            } catch (e) {
                showError('Ошибка сохранения: ' + (e.message || e));
            } finally {
                btn.disabled = false;
            }
        }

        function renderItems(items) {
            itemsCache = items || [];
            const root = document.getElementById('list');
            if (!itemsCache.length) {
                root.innerHTML = '<div class="empty">Пока нет сохранённых анализов</div>';
                return;
            }
            root.innerHTML = itemsCache.map((it) => {
                const name = cardTitle(it);
                return (
                    '<div class="item" data-id="' + it.id + '">' +
                    '<div class="item-title">' + escapeHtml(name) + '</div>' +
                    '<div class="item-actions">' +
                    '<button type="button" class="item-edit" title="Переименовать" ' +
                    'aria-label="Переименовать" data-edit-id="' + it.id + '">' +
                    '<i class="fa fa-pencil" aria-hidden="true"></i>' +
                    '</button>' +
                    '<button type="button" class="item-edit item-delete" title="Удалить" ' +
                    'aria-label="Удалить" data-delete-id="' + it.id + '">' +
                    '<i class="fa fa-trash" aria-hidden="true"></i>' +
                    '</button>' +
                    '</div></div>'
                );
            }).join('');

            root.querySelectorAll('.item').forEach((el) => {
                el.addEventListener('click', () => openView(el.getAttribute('data-id')));
            });
            root.querySelectorAll('.item-edit[data-edit-id]').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    openRenameModal(btn.getAttribute('data-edit-id'), e);
                });
            });
            root.querySelectorAll('.item-delete').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    openDeleteModal(btn.getAttribute('data-delete-id'), e);
                });
            });
        }

        async function loadList() {
            showError('');
            const initData = getInitData();
            if (!initData) {
                showError('Откройте кабинет через Telegram-команду /match_analysis');
                return;
            }
            try {
                if (window.Telegram && Telegram.WebApp) {
                    Telegram.WebApp.ready();
                    const fsMeta = document.querySelector('meta[name="webapp-fullscreen"]');
                    if (fsMeta && fsMeta.getAttribute('content') === '1') {
                        try { Telegram.WebApp.expand(); } catch (e) {}
                    }
                }
                const resp = await fetch('/api/match_analysis/list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData }),
                });
                const payload = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(payload.detail || ('HTTP ' + resp.status));
                renderItems(payload.items || []);
            } catch (e) {
                showError('Ошибка: ' + (e.message || e));
                document.getElementById('list').innerHTML = '';
            }
        }

        document.getElementById('renameModal').addEventListener('click', (e) => {
            if (e.target.id === 'renameModal') closeRenameModal();
        });
        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target.id === 'deleteModal') closeDeleteModal();
        });
        document.getElementById('renameInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveRename();
            } else if (e.key === 'Escape') {
                closeRenameModal();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (document.getElementById('deleteModal').classList.contains('open')) {
                closeDeleteModal();
            }
        });

        document.addEventListener('DOMContentLoaded', loadList);
    </script>
</body>
</html>
