<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="board-screenshot-font-scale" content="{{ board_viewer_screenshot_font_scale_percent | default(100) }}">
    <meta name="web-standalone-mode" content="{% if web_standalone_mode|default(false) %}1{% else %}0{% endif %}">
    <meta name="webapp-fullscreen-enabled" content="{% if webapp_fullscreen_enabled %}1{% else %}0{% endif %}">
    <meta name="board-viewer-is-admin" content="{% if is_admin|default(false) %}1{% else %}0{% endif %}">
    <title>Backgammon Board Viewer</title>
    <link rel="preload" href="/static/board.webp" as="image" fetchpriority="high">
    <link rel="preload" href="/static/white_checker.webp" as="image">
    <link rel="preload" href="/static/black_checker.webp" as="image">
    <link rel="stylesheet" href="/static/css/font-awesome-pokaz.css?t={{ cache_timestamp }}">
    <link rel="stylesheet" href="/static/css/board_viewer.css?t={{ cache_timestamp }}">
    <meta name="static-asset-v" content="{{ cache_timestamp }}">
    <script>window.__STATIC_ASSET_V = "{{ cache_timestamp }}";</script>
    {% if not web_standalone_mode|default(false) %}
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    {% endif %}
    <script src="/static/js/board_viewer.js?t={{ cache_timestamp }}" defer></script>
</head>

<body class="{% if web_standalone_mode|default(false) %}web-standalone{% endif %}">
    {% if web_standalone_mode|default(false) %}
    <a class="web-standalone-back" href="/web/board">← К загрузке матчей</a>
    {% endif %}
    <div class="container">
        <div class="board-layout">
            <div class="board-block">
                <div class="header">
                    <div id="match-info"></div>
                    <div id="players-info"></div>
                    <div id="top-row">
                        <span id="crawfordLabel" style="visibility: hidden;">Кроуфорд</span>
                        <div class="center-select">
                            <span id="match-type"></span>
                            <select id="gameSelect">
                                <option value="0">Game 1</option>
                            </select>
                            <span id="match-score"></span>
                        </div>
                        <div class="pips-container">
                            <div id="black-pips" class="pips-above-board">0</div>
                        </div>
                    </div>
                </div>
                <canvas id="boardCanvas" width="800" height="800"></canvas>

                <div class="board-footer">
                    <div class="move-info" id="moveInfo">Initial Position</div>
                    <div id="red-pips" class="pips-below-board">0</div>
                </div>
            </div>

            <div class="board-panel">
                <div id="controls">
                    <button onclick="toggleInvert()" id="invertBtn" title="Invert Board"></button>
                    <div class="center-controls">
                        <button onclick="prevTurn()" id="prevBtn" title="Previous Move"></button>
                        <div class="turn-display">
                            <span id="turnLabel">1</span>
                        </div>
                        <button onclick="nextTurn()" id="nextBtn" title="Next Move"></button>
                    </div>
                </div>
                <div id="boardToolbar" class="board-toolbar">
                    <div class="board-toolbar-row screenshot-controls-row">
                        <button type="button" id="screenshotBtn" title="Выслать скриншот экрана" aria-label="Выслать скриншот экрана"></button>
                        <button type="button" id="screenSaveBtn" title="Добавить скриншот в буфер обмена" aria-label="Добавить скриншот в буфер обмена"></button>
                        <button type="button" id="screenUploadBtn" title="Выслать архив со скриншотами" aria-label="Выслать архив со скриншотами"></button>
                    </div>
                    <div class="board-toolbar-row board-options-row">
                        <input type="checkbox" id="hideInfoCheckbox" class="board-visually-hidden" tabindex="-1" aria-hidden="true">
                        <button type="button" id="hideInfoToggle" class="board-option-toggle" title="Данные матча на скриншоте" aria-label="Данные матча на скриншоте" aria-pressed="false">
                            <i class="fa fa-file-text-o" aria-hidden="true"></i>
                        </button>
                        <input type="checkbox" id="skipAnimationCheckbox" class="board-visually-hidden" tabindex="-1" aria-hidden="true">
                        <button type="button" id="skipAnimationToggle" class="board-option-toggle" title="Анимация шашек" aria-label="Анимация шашек" aria-pressed="false">
                            <i class="fa fa-play" aria-hidden="true"></i>
                        </button>
                        <input type="checkbox" id="hidePipsCheckbox" class="board-visually-hidden" tabindex="-1" aria-hidden="true">
                        <button type="button" id="hidePipsToggle" class="board-option-toggle" title="Отображение пипсов" aria-label="Отображение пипсов" aria-pressed="false">
                            <i class="fa fa-sort-numeric-asc" aria-hidden="true"></i>
                        </button>
                        <button type="button" id="supportBtn" class="board-option-action" onclick="openSupportModal()" title="Отправить скрин в тех поддержку" aria-label="Отправить скрин в тех поддержку">
                            <i class="fa fa-camera" aria-hidden="true"></i>
                        </button>
                        <label class="board-option-speed" title="Скорость анимации">
                            <i class="fa fa-tachometer" aria-hidden="true"></i>
                            <select id="animationSpeedSlider" aria-label="Скорость анимации">
                                <option value="0.4">0.4</option>
                                <option value="0.7">0.7</option>
                                <option value="1.0" selected>1.0</option>
                                <option value="1.3">1.3</option>
                                <option value="1.6">1.6</option>
                            </select>
                        </label>
                    </div>
                </div>
                <div id="adminButtonContainer" style="margin: 20px 0; text-align: center; display: none;">
                    <button id="openPipCountCardEditorBtn" class="pip-count-card-btn" type="button" onclick="openPipCountCardEditor()" data-version="{{ cache_timestamp }}">
                        Карточки: подсчет пипсов
                    </button>
                    <div class="admin-screenshot-font-scale">
                        <label for="screenshotFontScaleSelect">Размер шрифта на скриншоте:</label>
                        <select id="screenshotFontScaleSelect" onchange="saveBoardViewerScreenshotFontScale()">
                            <option value="80">80%</option>
                            <option value="90">90%</option>
                            <option value="100">100%</option>
                            <option value="110">110%</option>
                            <option value="120">120%</option>
                            <option value="130">130%</option>
                            <option value="140">140%</option>
                            <option value="150">150%</option>
                            <option value="160">160%</option>
                            <option value="170">170%</option>
                            <option value="180">180%</option>
                            <option value="190">190%</option>
                            <option value="200">200%</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div id="supportModal" class="modal">
            <div class="modal-content">
                <h2>Техническая поддержка</h2>
                <p>Опишите проблему, с которой вы столкнулись:</p>
                <textarea id="supportText" placeholder="Введите текст сообщения..."></textarea>
                <div class="modal-footer">
                    <button class="cancel-btn" onclick="closeSupportModal()">Отмена</button>
                    <button id="sendSupportBtn" onclick="sendToSupport()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <div id="msgModalOverlay" class="msg-modal-overlay">
        <div class="msg-modal">
            <div class="msg-modal-header">
                <div class="msg-modal-icon" id="msgModalIcon"></div>
                <p class="msg-modal-content" id="msgModalContent"></p>
            </div>
            <div class="msg-modal-footer">
                <button type="button" class="msg-modal-ok-btn" id="msgModalOkBtn">ОК</button>
            </div>
        </div>
    </div>
</body>

</html>
