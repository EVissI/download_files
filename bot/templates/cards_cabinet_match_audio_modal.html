{# Модалки управления аудио анализа матча (отдельный include — без кэша вместе со страницей). #}
<style>
    .tile__audio {
        position: absolute;
        right: 2px;
        bottom: 2px;
        z-index: 2;
        width: 22px;
        height: 22px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: rgba(30, 30, 30, 0.88);
        color: #9fd0ff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
    }

    .tile__audio:active {
        background: rgba(40, 55, 75, 0.95);
    }

    .tile__audio i {
        font-size: 12px;
        line-height: 1;
    }

    .tile__audio.has-audio {
        color: #6ad0a0;
        border-color: rgba(106, 208, 160, 0.45);
    }

    .ma-audio-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1200;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
    }

    .ma-audio-modal--edit {
        z-index: 1210;
    }

    .ma-audio-modal.is-open {
        display: flex;
    }

    .ma-audio-modal__overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.62);
    }

    .ma-audio-modal__box {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        max-height: min(78vh, 640px);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: #242424;
        border: 1px solid #3a3a3a;
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        padding: 14px 14px 12px;
        box-sizing: border-box;
    }

    .ma-audio-modal__title {
        margin: 0 0 4px;
        font-size: 1rem;
        font-weight: 600;
        color: #eee;
    }

    .ma-audio-modal__sub {
        margin: 0 0 10px;
        font-size: 0.8rem;
        color: #9a9a9a;
        line-height: 1.35;
    }

    .ma-audio-modal__msg {
        margin: 0 0 8px;
        min-height: 1.1em;
        font-size: 0.78rem;
        color: #c9a06a;
    }

    .ma-audio-modal__msg.is-error {
        color: #e8a0a0;
    }

    .ma-audio-modal__list {
        flex: 1;
        overflow: auto;
        margin: 0 0 10px;
        padding: 0;
        list-style: none;
        border: 1px solid #333;
        border-radius: 8px;
        background: #1c1c1c;
        min-height: 80px;
    }

    .ma-audio-modal__empty {
        margin: 0;
        padding: 18px 12px;
        text-align: center;
        color: #888;
        font-size: 0.85rem;
    }

    .ma-audio-modal__item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 10px;
        border-bottom: 1px solid #2e2e2e;
    }

    .ma-audio-modal__item:last-child {
        border-bottom: 0;
    }

    .ma-audio-modal__meta {
        flex: 1;
        min-width: 0;
    }

    .ma-audio-modal__name {
        display: block;
        font-size: 0.82rem;
        color: #e6e6e6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .ma-audio-modal__frame {
        display: block;
        margin-top: 2px;
        font-size: 0.72rem;
        color: #8e8e8e;
    }

    .ma-audio-modal__actions-row {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
    }

    .ma-audio-modal__icon-btn {
        width: 28px;
        height: 28px;
        border: 1px solid #4a4a4a;
        border-radius: 7px;
        background: #2d2d2d;
        color: #ddd;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        font-size: 0.78rem;
        line-height: 1;
        text-decoration: none;
    }

    .ma-audio-modal__icon-btn:active {
        background: #3a3a3a;
    }

    .ma-audio-modal__icon-btn--danger {
        color: #f0b0b0;
    }

    .ma-audio-modal__icon-btn.is-recording {
        color: #ff6b6b;
        border-color: rgba(255, 107, 107, 0.55);
        animation: ma-cab-audio-pulse 1.1s ease-in-out infinite;
    }

    @keyframes ma-cab-audio-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
    }

    .ma-audio-modal__footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
    }

    .ma-audio-modal__btn {
        border: 1px solid #4a4a4a;
        border-radius: 8px;
        background: #2d2d2d;
        color: #ddd;
        cursor: pointer;
        padding: 8px 12px;
        font-size: 0.85rem;
    }

    .ma-audio-modal__btn--primary {
        background: #3a5a8a;
        border-color: #4a6a9a;
        color: #fff;
    }

    .ma-audio-modal__btn:disabled {
        opacity: 0.55;
        cursor: default;
    }

    .ma-audio-modal__edit-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 4px 0 12px;
    }

    .ma-audio-modal__edit-actions .ma-audio-modal__btn {
        flex: 1 1 auto;
        min-width: 120px;
    }
</style>

<div id="maAudioListModal" class="ma-audio-modal" aria-hidden="true">
    <div class="ma-audio-modal__overlay" id="maAudioListModalOverlay"></div>
    <div class="ma-audio-modal__box" role="dialog" aria-modal="true" aria-labelledby="maAudioListModalTitle">
        <h3 id="maAudioListModalTitle" class="ma-audio-modal__title">Аудиофайлы анализа</h3>
        <p id="maAudioListModalSub" class="ma-audio-modal__sub"></p>
        <p id="maAudioListModalMsg" class="ma-audio-modal__msg"></p>
        <ul id="maAudioListModalList" class="ma-audio-modal__list"></ul>
        <div class="ma-audio-modal__footer">
            <button type="button" id="maAudioListModalCloseBtn" class="ma-audio-modal__btn">Закрыть</button>
        </div>
    </div>
</div>

<div id="maAudioEditModal" class="ma-audio-modal ma-audio-modal--edit" aria-hidden="true">
    <div class="ma-audio-modal__overlay" id="maAudioEditModalOverlay"></div>
    <div class="ma-audio-modal__box" role="dialog" aria-modal="true" aria-labelledby="maAudioEditModalTitle">
        <h3 id="maAudioEditModalTitle" class="ma-audio-modal__title">Изменить аудио</h3>
        <p id="maAudioEditModalSub" class="ma-audio-modal__sub"></p>
        <p id="maAudioEditModalMsg" class="ma-audio-modal__msg"></p>
        <div class="ma-audio-modal__edit-actions">
            <button type="button" id="maAudioEditAttachBtn" class="ma-audio-modal__btn ma-audio-modal__btn--primary">
                <i class="fa fa-paperclip" aria-hidden="true"></i> Прикрепить файл
            </button>
            <button type="button" id="maAudioEditRecordBtn" class="ma-audio-modal__btn">
                <i class="fa fa-microphone" aria-hidden="true"></i> Записать
            </button>
        </div>
        <input type="file" id="maAudioEditFileInput" accept="audio/*" style="display:none" tabindex="-1">
        <div class="ma-audio-modal__footer">
            <button type="button" id="maAudioEditModalCloseBtn" class="ma-audio-modal__btn">Отмена</button>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    var listModal = document.getElementById('maAudioListModal');
    var listOverlay = document.getElementById('maAudioListModalOverlay');
    var listCloseBtn = document.getElementById('maAudioListModalCloseBtn');
    var listEl = document.getElementById('maAudioListModalList');
    var listMsg = document.getElementById('maAudioListModalMsg');
    var listSub = document.getElementById('maAudioListModalSub');
    var listTitle = document.getElementById('maAudioListModalTitle');

    var editModal = document.getElementById('maAudioEditModal');
    var editOverlay = document.getElementById('maAudioEditModalOverlay');
    var editCloseBtn = document.getElementById('maAudioEditModalCloseBtn');
    var editSub = document.getElementById('maAudioEditModalSub');
    var editMsg = document.getElementById('maAudioEditModalMsg');
    var editAttachBtn = document.getElementById('maAudioEditAttachBtn');
    var editRecordBtn = document.getElementById('maAudioEditRecordBtn');
    var editFileInput = document.getElementById('maAudioEditFileInput');

    var state = {
        matchId: null,
        matchTitle: '',
        items: [],
        editItem: null,
        busy: false,
        mediaRecorder: null,
        recordChunks: [],
    };

    function api() {
        return window.CardsCabinetMatchAudioApi || {};
    }

    function getInitData() {
        if (typeof api().getInitData === 'function') {
            return api().getInitData() || '';
        }
        try {
            return (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || '';
        } catch (_e) {
            return '';
        }
    }

    function showNotice(message, title) {
        if (typeof api().showNotice === 'function') {
            return api().showNotice(message, title);
        }
        window.alert(String(message || ''));
        return Promise.resolve();
    }

    function showConfirm(message, title, options) {
        if (typeof api().showConfirm === 'function') {
            return api().showConfirm(message, title, options || {});
        }
        return Promise.resolve(window.confirm(String(message || '')));
    }

    function buildViewUrl(matchId, gameNumber, moveIndex) {
        if (typeof api().buildMatchAnalysisViewUrl === 'function') {
            var base = api().buildMatchAnalysisViewUrl(matchId);
            var sep = base.indexOf('?') >= 0 ? '&' : '?';
            return (
                base +
                sep +
                'game=' + encodeURIComponent(String(gameNumber)) +
                '&move=' + encodeURIComponent(String(moveIndex))
            );
        }
        return (
            '/match-analysis-view?id=' + encodeURIComponent(String(matchId)) +
            '&error=0&game=' + encodeURIComponent(String(gameNumber)) +
            '&move=' + encodeURIComponent(String(moveIndex))
        );
    }

    function setListMsg(text, isError) {
        if (!listMsg) return;
        listMsg.textContent = String(text || '');
        listMsg.classList.toggle('is-error', !!isError && !!text);
    }

    function setEditMsg(text, isError) {
        if (!editMsg) return;
        editMsg.textContent = String(text || '');
        editMsg.classList.toggle('is-error', !!isError && !!text);
    }

    function frameLabel(item) {
        var parts = ['Игра ' + String(item.game_number), 'ход #' + String(item.move_index)];
        if (item.turn != null && item.turn !== '') {
            parts.push('turn ' + String(item.turn));
        }
        if (item.gnu_move) {
            parts.push(String(item.gnu_move));
        } else if (item.action) {
            parts.push(String(item.action));
        }
        return parts.join(' · ');
    }

    function closeEditModal() {
        stopRecordingIfNeeded();
        if (!editModal) return;
        editModal.classList.remove('is-open');
        editModal.setAttribute('aria-hidden', 'true');
        state.editItem = null;
        setEditMsg('');
        if (editRecordBtn) {
            editRecordBtn.classList.remove('is-recording');
            editRecordBtn.innerHTML = '<i class="fa fa-microphone" aria-hidden="true"></i> Записать';
        }
    }

    function closeListModal() {
        closeEditModal();
        if (!listModal) return;
        listModal.classList.remove('is-open');
        listModal.setAttribute('aria-hidden', 'true');
        state.matchId = null;
        state.items = [];
        setListMsg('');
    }

    function openListModal() {
        if (!listModal) return;
        listModal.classList.add('is-open');
        listModal.setAttribute('aria-hidden', 'false');
    }

    function openEditModal(item) {
        state.editItem = item;
        if (editSub) {
            editSub.textContent =
                (state.matchTitle ? state.matchTitle + ' — ' : '') + frameLabel(item) +
                (item.audio_name ? '\nТекущий файл: ' + item.audio_name : '');
        }
        setEditMsg('');
        if (!editModal) return;
        editModal.classList.add('is-open');
        editModal.setAttribute('aria-hidden', 'false');
    }

    function renderList() {
        if (!listEl) return;
        listEl.innerHTML = '';
        if (!state.items.length) {
            var empty = document.createElement('p');
            empty.className = 'ma-audio-modal__empty';
            empty.textContent = 'В этом анализе пока нет прикреплённых аудио';
            listEl.appendChild(empty);
            return;
        }
        state.items.forEach(function (item) {
            var li = document.createElement('li');
            li.className = 'ma-audio-modal__item';

            var meta = document.createElement('div');
            meta.className = 'ma-audio-modal__meta';
            var name = document.createElement('span');
            name.className = 'ma-audio-modal__name';
            name.textContent = item.audio_name || 'аудио';
            name.title = item.audio_name || '';
            var frame = document.createElement('span');
            frame.className = 'ma-audio-modal__frame';
            frame.textContent = frameLabel(item);
            meta.appendChild(name);
            meta.appendChild(frame);

            var actions = document.createElement('div');
            actions.className = 'ma-audio-modal__actions-row';

            var redirectBtn = document.createElement('button');
            redirectBtn.type = 'button';
            redirectBtn.className = 'ma-audio-modal__icon-btn';
            redirectBtn.title = 'Перейти к кадру';
            redirectBtn.setAttribute('aria-label', 'Перейти к кадру');
            redirectBtn.innerHTML = '<i class="fa fa-external-link" aria-hidden="true"></i>';
            redirectBtn.addEventListener('click', function () {
                window.location.assign(
                    buildViewUrl(state.matchId, item.game_number, item.move_index)
                );
            });

            var editBtn = document.createElement('button');
            editBtn.type = 'button';
            editBtn.className = 'ma-audio-modal__icon-btn';
            editBtn.title = 'Изменить';
            editBtn.setAttribute('aria-label', 'Изменить аудио');
            editBtn.innerHTML = '<i class="fa fa-pencil" aria-hidden="true"></i>';
            editBtn.addEventListener('click', function () {
                openEditModal(item);
            });

            var delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'ma-audio-modal__icon-btn ma-audio-modal__icon-btn--danger';
            delBtn.title = 'Удалить';
            delBtn.setAttribute('aria-label', 'Удалить аудио');
            delBtn.innerHTML = '<i class="fa fa-trash" aria-hidden="true"></i>';
            delBtn.addEventListener('click', function () {
                deleteAudio(item);
            });

            actions.appendChild(redirectBtn);
            actions.appendChild(editBtn);
            actions.appendChild(delBtn);
            li.appendChild(meta);
            li.appendChild(actions);
            listEl.appendChild(li);
        });
    }

    function patchAudioCount(matchId, count) {
        if (typeof api().onAudioCountChanged === 'function') {
            api().onAudioCountChanged(matchId, count);
        }
    }

    function loadAudios() {
        var initData = getInitData();
        if (!initData || !state.matchId) {
            setListMsg('Нет Telegram initData', true);
            return Promise.resolve();
        }
        setListMsg('Загрузка…');
        return fetch('/api/match_analysis/audio/list', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ init_data: initData, id: state.matchId }),
        })
            .then(function (resp) {
                return resp.json().catch(function () { return {}; }).then(function (payload) {
                    if (!resp.ok) {
                        throw new Error(payload.detail || ('HTTP ' + resp.status));
                    }
                    return payload;
                });
            })
            .then(function (payload) {
                state.items = Array.isArray(payload.items) ? payload.items : [];
                setListMsg(state.items.length ? ('Файлов: ' + state.items.length) : '');
                if (listSub) {
                    listSub.textContent = state.matchTitle
                        ? ('Матч: ' + state.matchTitle)
                        : ('ID #' + String(state.matchId));
                }
                renderList();
                patchAudioCount(state.matchId, state.items.length);
            })
            .catch(function (err) {
                console.error(err);
                state.items = [];
                renderList();
                setListMsg('Ошибка загрузки: ' + (err.message || err), true);
            });
    }

    function deleteAudio(item) {
        if (!item || state.busy) return;
        showConfirm(
            'Удалить аудио «' + (item.audio_name || 'файл') + '» с кадра «' + frameLabel(item) + '»?',
            'Удаление аудио',
            { confirmLabel: 'Удалить', danger: true }
        ).then(function (ok) {
            if (!ok) return;
            var initData = getInitData();
            if (!initData) {
                showNotice('Нет Telegram initData', 'Ошибка');
                return;
            }
            state.busy = true;
            setListMsg('Удаление…');
            fetch('/api/match_analysis/audio/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    init_data: initData,
                    id: state.matchId,
                    game_number: item.game_number,
                    move_index: item.move_index,
                    delete_s3: true,
                }),
            })
                .then(function (resp) {
                    return resp.json().catch(function () { return {}; }).then(function (payload) {
                        if (!resp.ok) {
                            throw new Error(payload.detail || ('HTTP ' + resp.status));
                        }
                        return payload;
                    });
                })
                .then(function () {
                    return loadAudios();
                })
                .catch(function (err) {
                    console.error(err);
                    setListMsg('Ошибка удаления: ' + (err.message || err), true);
                    showNotice('Ошибка удаления аудио: ' + (err.message || err), 'Ошибка');
                })
                .finally(function () {
                    state.busy = false;
                });
        });
    }

    function uploadBlob(blob, filename) {
        var item = state.editItem;
        var initData = getInitData();
        if (!item || !initData || !state.matchId) {
            setEditMsg('Не выбран кадр или нет initData', true);
            return Promise.resolve();
        }
        state.busy = true;
        setEditMsg('Загрузка…');
        if (editAttachBtn) editAttachBtn.disabled = true;
        if (editRecordBtn) editRecordBtn.disabled = true;

        var fd = new FormData();
        fd.append('init_data', initData);
        fd.append('match_analysis_id', String(state.matchId));
        fd.append('game_number', String(item.game_number));
        fd.append('move_index', String(item.move_index));
        fd.append('file', blob, filename || 'audio.webm');

        return fetch('/api/match_analysis/audio/upload', {
            method: 'POST',
            body: fd,
        })
            .then(function (resp) {
                return resp.json().catch(function () { return {}; }).then(function (payload) {
                    if (!resp.ok) {
                        var detail = payload.detail || ('HTTP ' + resp.status);
                        throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
                    }
                    return payload;
                });
            })
            .then(function () {
                closeEditModal();
                return loadAudios().then(function () {
                    showNotice('Аудио обновлено', 'Готово');
                });
            })
            .catch(function (err) {
                console.error(err);
                setEditMsg('Ошибка: ' + (err.message || err), true);
                showNotice('Ошибка загрузки аудио: ' + (err.message || err), 'Ошибка');
            })
            .finally(function () {
                state.busy = false;
                if (editAttachBtn) editAttachBtn.disabled = false;
                if (editRecordBtn) editRecordBtn.disabled = false;
            });
    }

    function stopRecordingIfNeeded() {
        if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
            try {
                state.mediaRecorder.stop();
            } catch (_e) { /* ignore */ }
        }
        state.mediaRecorder = null;
        state.recordChunks = [];
    }

    function startOrStopRecording() {
        if (state.busy) return;
        if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
            state.mediaRecorder.stop();
            return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setEditMsg('Запись не поддерживается в этом браузере', true);
            return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
            state.recordChunks = [];
            var mimeCandidates = [
                'audio/ogg;codecs=opus',
                'audio/ogg',
                'audio/webm;codecs=opus',
                'audio/webm',
            ];
            var mime = '';
            for (var i = 0; i < mimeCandidates.length; i++) {
                if (window.MediaRecorder && MediaRecorder.isTypeSupported(mimeCandidates[i])) {
                    mime = mimeCandidates[i];
                    break;
                }
            }
            state.mediaRecorder = mime
                ? new MediaRecorder(stream, { mimeType: mime })
                : new MediaRecorder(stream);
            state.mediaRecorder.ondataavailable = function (e) {
                if (e.data && e.data.size) state.recordChunks.push(e.data);
            };
            state.mediaRecorder.onstop = function () {
                try {
                    stream.getTracks().forEach(function (t) { t.stop(); });
                } catch (_e) { /* ignore */ }
                if (editRecordBtn) {
                    editRecordBtn.classList.remove('is-recording');
                    editRecordBtn.innerHTML = '<i class="fa fa-microphone" aria-hidden="true"></i> Записать';
                }
                var blobType = (state.mediaRecorder && state.mediaRecorder.mimeType) || mime || 'audio/webm';
                var blob = new Blob(state.recordChunks, { type: blobType });
                state.recordChunks = [];
                state.mediaRecorder = null;
                if (!blob.size) {
                    setEditMsg('Пустая запись', true);
                    return;
                }
                var ext = blobType.indexOf('ogg') >= 0 ? 'ogg' : 'webm';
                uploadBlob(blob, 'voice_' + Date.now() + '.' + ext);
            };
            state.mediaRecorder.start();
            if (editRecordBtn) {
                editRecordBtn.classList.add('is-recording');
                editRecordBtn.innerHTML = '<i class="fa fa-stop" aria-hidden="true"></i> Стоп';
            }
            setEditMsg('Идёт запись… нажмите «Стоп», чтобы сохранить');
        }).catch(function (err) {
            console.error(err);
            setEditMsg('Нет доступа к микрофону: ' + (err.message || err), true);
        });
    }

    function openForMatch(matchId, matchTitle) {
        var idNum = Number(matchId);
        if (!idNum) return;
        state.matchId = idNum;
        state.matchTitle = String(matchTitle || '').trim();
        if (listTitle) {
            listTitle.textContent = 'Аудиофайлы анализа';
        }
        if (listSub) {
            listSub.textContent = state.matchTitle
                ? ('Матч: ' + state.matchTitle)
                : ('ID #' + String(idNum));
        }
        openListModal();
        loadAudios();
    }

    if (listOverlay) listOverlay.addEventListener('click', closeListModal);
    if (listCloseBtn) listCloseBtn.addEventListener('click', closeListModal);
    if (editOverlay) editOverlay.addEventListener('click', closeEditModal);
    if (editCloseBtn) editCloseBtn.addEventListener('click', closeEditModal);
    if (editAttachBtn) {
        editAttachBtn.addEventListener('click', function () {
            if (state.busy) return;
            if (editFileInput) editFileInput.click();
        });
    }
    if (editRecordBtn) {
        editRecordBtn.addEventListener('click', startOrStopRecording);
    }
    if (editFileInput) {
        editFileInput.addEventListener('change', function (ev) {
            var file = ev.target && ev.target.files && ev.target.files[0];
            if (ev.target) ev.target.value = '';
            if (!file) return;
            uploadBlob(file, file.name || 'audio.webm');
        });
    }

    window.CardsCabinetMatchAudio = {
        open: openForMatch,
