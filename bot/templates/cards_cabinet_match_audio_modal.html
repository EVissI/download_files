{# Модалки управления аудио анализа матча. CSS/JS — /static, кэш ?t=cache_timestamp. #}
<div id="maAudioListModal" class="ma-audio-modal" aria-hidden="true">
    <div class="ma-audio-modal__overlay" id="maAudioListModalOverlay"></div>
    <div class="ma-audio-modal__box" role="dialog" aria-modal="true" aria-labelledby="maAudioListModalTitle">
        <h3 id="maAudioListModalTitle" class="ma-audio-modal__title">Аудиофайлы анализа</h3>
        <p id="maAudioListModalSub" class="ma-audio-modal__sub"></p>
        <p id="maAudioListModalMsg" class="ma-audio-modal__msg"></p>
        <div id="maAudioListProgress" class="ma-audio-modal__progress" hidden aria-hidden="true">
            <div class="ma-audio-modal__progress-track" aria-hidden="true">
                <div class="ma-audio-modal__progress-bar"></div>
            </div>
        </div>
        <div class="ma-audio-modal__scroll">
            <ul id="maAudioListModalList" class="ma-audio-modal__list"></ul>
        </div>
        <div class="ma-audio-modal__footer">
            <div class="ma-audio-modal__footer-left">
                <button type="button" id="maAudioListImportBtn" class="ma-audio-modal__btn" title="Скачать все аудио в ZIP (WAV или MP3)">
                    Экспорт
                </button>
                <button type="button" id="maAudioListExportBtn" class="ma-audio-modal__btn" title="Загрузить ZIP с WAV/MP3 и заменить аудио">
                    Импорт
                </button>
                <input type="file" id="maAudioListExportFileInput" accept=".zip,application/zip" style="display:none" tabindex="-1">
            </div>
            <div class="ma-audio-modal__footer-right">
                <button type="button" id="maAudioListModalCloseBtn" class="ma-audio-modal__btn">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<div id="maAudioExportFormatModal" class="ma-audio-modal ma-audio-modal--edit ma-audio-modal--format" aria-hidden="true">
    <div class="ma-audio-modal__overlay" id="maAudioExportFormatOverlay"></div>
    <div class="ma-audio-modal__box" role="dialog" aria-modal="true" aria-labelledby="maAudioExportFormatTitle">
        <h3 id="maAudioExportFormatTitle" class="ma-audio-modal__title">Формат экспорта</h3>
        <p id="maAudioExportFormatSub" class="ma-audio-modal__sub">Выберите формат файла</p>
        <div class="ma-audio-modal__format-options" role="radiogroup" aria-label="Формат экспорта">
            <label class="ma-audio-modal__format-option">
                <input type="radio" name="maAudioExportFormat" value="wav" checked>
                <span class="ma-audio-modal__format-option-text">
                    <span class="ma-audio-modal__format-option-title">WAV</span>
                    <span class="ma-audio-modal__format-option-hint">Без сжатия, максимальное качество</span>
                </span>
            </label>
            <label class="ma-audio-modal__format-option">
                <input type="radio" name="maAudioExportFormat" value="mp3">
                <span class="ma-audio-modal__format-option-text">
                    <span class="ma-audio-modal__format-option-title">MP3</span>
                    <span class="ma-audio-modal__format-option-hint">Меньший размер файла</span>
                </span>
            </label>
        </div>
        <div class="ma-audio-modal__footer">
            <button type="button" id="maAudioExportFormatCancelBtn" class="ma-audio-modal__btn">Отмена</button>
            <button type="button" id="maAudioExportFormatConfirmBtn" class="ma-audio-modal__btn ma-audio-modal__btn--primary">Скачать</button>
        </div>
    </div>
</div>

<div id="maAudioEditModal" class="ma-audio-modal ma-audio-modal--edit" aria-hidden="true">
    <div class="ma-audio-modal__overlay" id="maAudioEditModalOverlay"></div>
    <div class="ma-audio-modal__box" role="dialog" aria-modal="true" aria-labelledby="maAudioEditModalTitle">
        <h3 id="maAudioEditModalTitle" class="ma-audio-modal__title">Изменить аудио</h3>
        <p id="maAudioEditModalSub" class="ma-audio-modal__sub"></p>
        <p id="maAudioEditModalMsg" class="ma-audio-modal__msg"></p>
        <div class="ma-audio-modal__edit-actions">
            <button type="button" id="maAudioEditAttachBtn" class="ma-audio-modal__btn ma-audio-modal__btn--primary">
                <i class="fa fa-paperclip" aria-hidden="true"></i> Прикрепить файл
            </button>
            <button type="button" id="maAudioEditRecordBtn" class="ma-audio-modal__btn">
                <i class="fa fa-microphone" aria-hidden="true"></i> Записать
            </button>
        </div>
        <input type="file" id="maAudioEditFileInput" accept="audio/*" style="display:none" tabindex="-1">
        <div class="ma-audio-modal__footer">
            <button type="button" id="maAudioEditModalCloseBtn" class="ma-audio-modal__btn">Отмена</button>
        </div>
    </div>
</div>
