<link rel="stylesheet" href="/static/css/web_support.css?t={{ cache_timestamp }}">
<script src="/static/js/web_support.js?t={{ cache_timestamp }}" defer></script>
{% if not hide_support_widget|default(false) and not is_admin|default(false) %}
<button type="button" class="support-fab" id="supportFab" title="Поддержка" aria-label="Написать в поддержку" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M5 5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4 3v-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
    </svg>
    <span class="support-fab-badge" data-support-fab-badge hidden>0</span>
</button>
<div class="support-panel" id="supportPanel" hidden>
    <div class="support-panel-head">
        <strong>Поддержка</strong>
        <button type="button" class="support-panel-close" id="supportPanelClose" aria-label="Закрыть">×</button>
    </div>
    <div class="support-messages" id="supportMessages">
        <div class="support-empty">Напишите сообщение — ответит администратор.</div>
    </div>
    <div class="support-composer">
        <textarea id="supportText" maxlength="4000" placeholder="Опишите вопрос… Можно вставить или перетащить файл."></textarea>
        <div class="support-file-chips" id="supportChips"></div>
        <div class="support-composer-row">
            <button type="button" class="support-attach-btn" id="supportAttach">Файл</button>
            <button type="button" class="support-send-btn" id="supportSend">Отправить</button>
        </div>
        <input id="supportFiles" type="file" multiple hidden accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.pdf,.txt,.zip,.mat,.sgf,.csv,.doc,.docx,.xlsx,image/*,application/pdf,application/zip">
        <div class="support-status" id="supportStatus"></div>
    </div>
    <div class="support-drop-overlay" id="supportDropOverlay">Перетащите файлы сюда</div>
</div>
{% endif %}
