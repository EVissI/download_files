<div id="webAssignUserModal" class="hw-assign-modal" aria-hidden="true">
    <div id="webAssignUserModalOverlay" class="hw-assign-modal__overlay"></div>
    <div class="hw-assign-modal__box" role="dialog" aria-modal="true" aria-labelledby="webAssignUserModalTitle">
        <h3 id="webAssignUserModalTitle" class="hw-assign-modal__title">Выбор пользователя</h3>
        <p id="webAssignUserModalSubtitle" class="hw-assign-modal__subtitle"></p>
        <label for="webAssignUserSearchInput" class="hw-assign-modal__label">Поиск пользователя</label>
        <input
            id="webAssignUserSearchInput"
            class="hw-assign-modal__input"
            type="text"
            placeholder="ID / логин"
            autocomplete="off"
        >
        <p id="webAssignUserModalMsg" class="hw-assign-modal__msg"></p>
        <div class="hw-assign-modal__table-wrap">
            <table class="hw-assign-modal__table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Логин</th>
                    </tr>
                </thead>
                <tbody id="webAssignUserUsersTbody"></tbody>
            </table>
        </div>
        <div class="hw-assign-modal__actions">
            <button type="button" id="webAssignUserCancelBtn" class="hw-link-modal__btn">Отмена</button>
            <button type="button" id="webAssignUserSubmitBtn" class="hw-link-modal__btn hw-link-modal__btn--primary">Отправить</button>
        </div>
    </div>
</div>
