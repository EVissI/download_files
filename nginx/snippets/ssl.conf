# Общие TLS-параметры. Намеренно не подключаем options-ssl-nginx.conf от certbot:
# nginx должен стартовать даже на сервере, где certbot ещё ничего не создал.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
